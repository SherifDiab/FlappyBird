<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background - Sky Blue Gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4EC0E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D742;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8B923;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#skyGrad)" stroke="#3498db" stroke-width="8"/>

  <!-- Cloud 1 -->
  <ellipse cx="120" cy="140" rx="50" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="150" cy="130" rx="40" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="90" cy="135" rx="35" ry="20" fill="white" opacity="0.8"/>

  <!-- Cloud 2 -->
  <ellipse cx="380" cy="180" rx="45" ry="22" fill="white" opacity="0.7"/>
  <ellipse cx="410" cy="172" rx="35" ry="18" fill="white" opacity="0.7"/>

  <!-- Bird Body -->
  <ellipse cx="256" cy="280" rx="120" ry="100" fill="url(#birdGrad)" stroke="#D4A017" stroke-width="4"/>

  <!-- Bird Belly -->
  <ellipse cx="256" cy="310" rx="80" ry="60" fill="#FDF5D6"/>

  <!-- Bird Wing -->
  <ellipse cx="200" cy="280" rx="50" ry="30" fill="#E8B923" stroke="#D4A017" stroke-width="3"/>
  <ellipse cx="195" cy="280" rx="35" ry="20" fill="#F5D742"/>

  <!-- Bird Eye (white part) -->
  <circle cx="310" cy="240" r="40" fill="white" stroke="#333" stroke-width="3"/>

  <!-- Bird Eye (pupil) -->
  <circle cx="318" cy="240" r="22" fill="#333"/>

  <!-- Bird Eye (highlight) -->
  <circle cx="325" cy="232" r="8" fill="white"/>

  <!-- Bird Beak - Orange -->
  <path d="M 350 270 L 420 290 L 350 310 Z" fill="#FF6B35" stroke="#E55A2B" stroke-width="3"/>

  <!-- Bird Beak - Top part highlight -->
  <path d="M 350 270 L 400 282 L 350 290 Z" fill="#FF8C5A"/>

  <!-- Eyebrow -->
  <path d="M 275 200 Q 310 185 345 200" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Tail feathers -->
  <ellipse cx="140" cy="260" rx="30" ry="15" fill="#E8B923" stroke="#D4A017" stroke-width="2"/>
  <ellipse cx="135" cy="280" rx="28" ry="12" fill="#F5D742" stroke="#D4A017" stroke-width="2"/>
  <ellipse cx="140" cy="300" rx="30" ry="15" fill="#E8B923" stroke="#D4A017" stroke-width="2"/>

  <!-- Small decorative feathers on head -->
  <ellipse cx="280" cy="185" rx="8" ry="20" fill="#E8B923" transform="rotate(-15 280 185)"/>
  <ellipse cx="260" cy="182" rx="6" ry="15" fill="#F5D742" transform="rotate(-25 260 182)"/>
</svg>
